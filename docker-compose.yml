services:
  db:
    image: postgres:17-alpine
    container_name: event-intel-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: event_intel
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d event_intel"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
